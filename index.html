<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>SoundFlow - Music for Everyone</title>
  <style>
    /* デザイン設定（CSS） */
    :root {
      --bg-color: #000000;
      --card-bg: #121212;
      --primary-color: #1DB954; /* Spotify風グリーン */
      --text-main: #ffffff;
      --text-sub: #b3b3b3;
      --danger: #e91429;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; margin: 0; overflow-y: auto;
      padding: 0 0 60px;
      box-sizing: border-box;
    }

    /* PC向けナビバー（装飾のみ） */
    .top-nav {
      width: 100%; box-sizing: border-box; background: #000000;
      border-bottom: 1px solid #2a2a2a; padding: 16px 40px;
      display: flex; align-items: center; gap: 32px;
      position: sticky; top: 0; z-index: 100;
    }
    .top-nav .logo { font-size: 20px; font-weight: bold; color: #ffffff; letter-spacing: 0.5px; }
    .top-nav .links { display: flex; gap: 28px; flex: 1; cursor: default; }
    .top-nav .links span { font-size: 14px; color: #ffffff; font-weight: bold; }
    .top-nav .search {
      background: #1f1f1f; border: 1px solid #333; border-radius: 500px;
      color: #b3b3b3; font-size: 13px; padding: 9px 16px; width: 260px;
      display: flex; align-items: center; gap: 8px; cursor: default;
    }
    .top-nav .profile {
      margin-left: auto; display: flex; align-items: center; gap: 8px; cursor: default;
    }
    .top-nav .profile .avatar {
      width: 30px; height: 30px; border-radius: 50%; background: #535353;
      display: flex; align-items: center; justify-content: center; font-size: 13px;
    }
    .top-nav .profile span { font-size: 13px; font-weight: bold; }

    .page-body { width: 100%; max-width: 900px; padding: 48px 40px 0; box-sizing: border-box; position: relative; }
    .back-chevron {
      position: absolute; left: 0; top: 52px; width: 34px; height: 34px; border-radius: 50%;
      background: #2a2a2a; color: #b3b3b3; display: flex; align-items: center; justify-content: center;
      font-size: 16px; cursor: default;
    }

    .screen {
      width: 100%; max-width: 640px; margin: 0 auto; padding: 8px 0 40px 64px;
      text-align: left; background: transparent;
      border-radius: 0; box-shadow: none;
    }

    h1 { font-size: 34px; margin-bottom: 20px; font-weight: bold; line-height: 1.3; }
    p { font-size: 15px; color: var(--text-sub); line-height: 1.7; margin-bottom: 30px; }

    .btn-row { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; }

    .btn {
      display: inline-block; width: auto; min-width: 150px; padding: 13px 28px;
      border-radius: 500px; border: none; font-weight: bold;
      font-size: 15px; cursor: pointer; transition: filter 0.15s, background-color 0.15s, color 0.15s, transform 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn-primary { background-color: var(--primary-color); color: black; }
    .btn-primary:hover { filter: brightness(1.15); }
    .btn-primary-textonly:hover { filter: brightness(1.15); }
    .btn-cancel-a { background: white; color: black; }
    .btn-cancel-a:hover { filter: brightness(1.05); }
    #btn-confirm-cancel:hover { filter: none; background-color: #e91429; color: white; }
    .btn-keep-a { background: black; color: white; border: 1px solid #727272; margin-top: 12px; }
    .btn-keep-a:hover { filter: brightness(1.4); }
    .btn-outline { background: transparent; color: white; border: 1px solid #727272; margin-top: 12px; }
    .btn-outline:hover { filter: brightness(1.4); }
    .btn-cancel-b { background: #d8d8d8; color: black; border: none; }
    .btn-cancel-b:hover { filter: none; background: #ffffff; }

    .hidden { display: none !important; }
    .step-indicator { color: var(--text-sub); font-size: 12px; margin-bottom: 10px; }
    
    textarea {
      width: 100%; background: #282828; border: none; color: white;
      padding: 12px; border-radius: 4px; margin-bottom: 20px; resize: none;
    }

    #survey-form input[type="radio"] {
      appearance: none; -webkit-appearance: none;
      width: 18px; height: 18px; border-radius: 50%;
      border: 2px solid #bdc1c6; background: white;
      cursor: pointer; transition: border-color 0.1s, background 0.1s;
      flex-shrink: 0;
    }
    #survey-form input[type="radio"]:checked {
      background: #1a73e8; border-color: #1a73e8;
    }

    .deceptive-link {
      background: none; border: none; color: #b3b3b3;
      text-decoration: underline; font-size: 12px; margin-top: 20px; cursor: pointer;
    }

    #secret-result {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9); display: flex; flex-direction: column;
      justify-content: center; align-items: center; z-index: 1000;
    }

  </style>
</head>
<body>

  <!-- モバイル制限モーダル -->
  <div id="mobile-block" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%;
       background:rgba(0,0,0,0.97); z-index:9999; justify-content:center; align-items:center; padding:24px; box-sizing:border-box;">
    <div style="background:#1a1a1a; border-radius:30px; padding:66px 42px; max-width:650px; width:100%; text-align:center; border:1px solid #333;">
      <div style="font-size:106px; margin-bottom:32px;">💻</div>
      <h2 style="font-size:38px; color:#ffffff; margin-bottom:30px; line-height:1.5; font-weight:bold;">この実験はパソコンで<br>行うことを想定しています</h2>
      <p style="font-size:24px; color:#d0d0d0; margin-bottom:48px; line-height:1.8;">
        スマートフォン・タブレットからの<br>アクセスが検出されました。<br>
        PCから下記のURLを開いてください。<br>
        ※PCは「全画面」で開いてください。
      </p>
      <div style="background:#282828; border-radius:14px; padding:24px 26px; margin-bottom:32px; word-break:break-all;
                  font-size:21px; color:#e0e0e0; text-align:left; border:1px solid #383838;" id="mobile-url-display"></div>
      <button onclick="copyUrl()"
              style="width:100%; padding:28px; border-radius:500px; border:none; background:#ffffff;
                     color:#000000; font-weight:bold; font-size:26px; cursor:pointer; margin-bottom:20px;"
              id="copy-btn">
        📋 URLをコピーする
      </button>
      <button onclick="shareUrl()"
              style="width:100%; padding:28px; border-radius:500px; border:none; background:#1DB954;
                     color:#000000; font-weight:bold; font-size:26px; cursor:pointer;">
        📤 URLをシェアする
      </button>
    </div>
  </div>

  <!-- ナビバー（装飾のみ） -->
  <nav class="top-nav">
    <span class="logo">SoundFlow</span>
    <div class="links"><span>Premiumプラン</span><span>サポート</span><span>ダウンロード</span></div>
    <div class="search">🔍&nbsp; アカウントやヘルプ記事を検索</div>
    <div class="profile"><div class="avatar">👤</div><span>プロフィール ▾</span></div>
  </nav>

  <div class="page-body">
    <div class="back-chevron">‹</div>

    <div id="screen-start" class="screen">
      <p style="color:#ffffff; font-size:22px; line-height:1.9; margin-bottom:32px;">
        あなたは音楽配信サービス「SoundFlow」プレミアムプランを<br>
        利用していましたが、<strong style="background:#ffffff;color:#000000;padding:2px 8px;border-radius:4px;">『月額料金が高い』</strong>と感じています。<br>
        <strong>解約手続きを行ってください。</strong>
      </p>

      <div class="btn-row">
        <button id="start-btn" class="btn btn-primary" onclick="startExperiment()">解約手続きを開始（調査用のページへ遷移します）</button>
      </div>
      <p style="color:#ffffff; font-size:16px; margin-top:16px;">
        ※タッチパネルではなく、マウスかトラックパッドで操作してください。
      </p>
    </div>
    
    <div id="screen-main" class="screen hidden">
      <div id="content-area"></div>
    </div>

    <div id="screen-end" class="hidden"></div>
  </div>

  <div id="modal-confirm" class="hidden" style="position:fixed;top:0;left:0;width:100%;height:100%;
       background:rgba(0,0,0,0.75);display:flex;justify-content:center;align-items:center;z-index:500;">
    <div class="screen" style="max-width:340px;padding:32px 24px;text-align:center;">
      <h1 style="font-size:18px;margin-bottom:12px;">解約を確定しますか？</h1>
      <p style="margin-bottom:24px;">この操作は取り消せません。</p>
      <div class="btn-row" style="justify-content:center;">
        <button class="btn btn-cancel-a" id="btn-confirm-cancel" onclick="confirmCancel()">はい、解約します</button>
        <button class="btn btn-keep-a" onclick="dismissCancel()">いいえ、戻る</button>
      </div>
    </div>
  </div>


  <script>
    /* 動きの設定（JavaScript） */
    
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx0DzAQKBP8XJ-FdZsTkxhTxxXeAMoSGLFVZXN-wKtgXktoClIa_rRfXU2V0YihouUY/exec';

    // 条件(A, B, C, D)の割り当て。URLに ?cond=A のような指定があればそれを使用（動作確認用）。
    // 指定がなければサーバー側（GAS）に問い合わせて、これまでの割り当て件数が最も少ない条件をランダムに1つ受け取る。
    const urlParams = new URLSearchParams(window.location.search);
    let cond = urlParams.get('cond') ? urlParams.get('cond').toUpperCase() : null;

    const startBtn = document.getElementById('start-btn');
    const condReady = cond
      ? Promise.resolve()
      : (() => {
          startBtn.disabled = true;
          startBtn.textContent = '準備中...';
          return fetch(`${GAS_URL}?action=assign`)
            .then(res => res.json())
            .then(data => { cond = data.condition; })
            .catch(() => { cond = ['A', 'B', 'C', 'D'][Math.floor(Math.random() * 4)]; })
            .finally(() => {
              startBtn.disabled = false;
              startBtn.textContent = '解約手続きを開始（調査用のページへ遷移します）';
            });
        })();

    // 今日から7日後の日付
    const _d = new Date(); _d.setDate(_d.getDate() + 7);
    const fmt = d => `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')}`;
    const deadlineStr = fmt(_d);
    const _d2 = new Date(_d); _d2.setDate(_d2.getDate() + 1);
    const nextDayStr = fmt(_d2);

    let startTime, endTime;
    let mouseDistance = 0;
    let clickCount = 0;
    let participantId = '';
    let pendingCancelExtra = null;
    let lastX = 0, lastY = 0;
    let currentStep = 1;
    let active = false;
    let selectedReasons = [];
    let bReasons = [], bAltServices = [], bFreeText = '';

    document.addEventListener('mousemove', e => {
      if (active) {
        if (lastX !== 0) {
          mouseDistance += Math.sqrt(Math.pow(e.pageX - lastX, 2) + Math.pow(e.pageY - lastY, 2));
        }
        lastX = e.pageX; lastY = e.pageY;
      }
    });

    document.addEventListener('click', () => {
      if (active) clickCount++;
    });

    function showCancelConfirm(extra = {}) {
      pendingCancelExtra = extra;
      document.getElementById('modal-confirm').classList.remove('hidden');
    }
    function confirmCancel() {
      document.getElementById('modal-confirm').classList.add('hidden');
      finishExp('cancel', pendingCancelExtra);
    }
    function dismissCancel() {
      document.getElementById('modal-confirm').classList.add('hidden');
      pendingCancelExtra = null;
    }

    function prevStep() {
      currentStep--;
      renderStep();
    }

    function startExperiment() {
      participantId = String(Math.floor(100000 + Math.random() * 900000));
      document.getElementById('screen-start').classList.add('hidden');
      document.getElementById('screen-main').classList.remove('hidden');
      startTime = Date.now();
      active = true;
      renderStep();
    }

    // 条件に合わせた画面の中身を作る
    function renderStep() {
      window.scrollTo(0, 0);
      const area = document.getElementById('content-area');
      
      if (cond === 'A') {
        // 条件A: 誠実なUI
        area.innerHTML = `
          <h1>解約の確認</h1>
          <p style="margin-bottom:16px;">解約後も<strong>${deadlineStr}</strong>までは再生可能です。いつでも再開できます。</p>
          <div style="background:#1a1a1a; border-radius:8px; padding:16px; margin-bottom:24px; text-align:left;">
            <div style="font-size:13px; color:#b3b3b3; margin-bottom:8px;">現在のプラン</div>
            <div style="font-size:16px; font-weight:bold; margin-bottom:12px;">プレミアム個人（¥980 / 月）</div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <span style="background:#2a2a2a; border:1px solid #444; border-radius:4px; font-size:11px; padding:3px 8px; color:#b3b3b3;">広告なし</span>
              <span style="background:#2a2a2a; border:1px solid #444; border-radius:4px; font-size:11px; padding:3px 8px; color:#b3b3b3;">オンデマンド再生</span>
              <span style="background:#2a2a2a; border:1px solid #444; border-radius:4px; font-size:11px; padding:3px 8px; color:#b3b3b3;">高音質ストリーミング</span>
            </div>
          </div>
          <div class="btn-row">
            <button class="btn btn-cancel-b" onclick="showCancelConfirm()">解約手続きを続行</button>
            <button class="btn btn-keep-a" onclick="finishExp('keep')">解約せずに戻る</button>
          </div>
        `;
      } else if (cond === 'B') {
        // 条件B: 手続きを長くする
        if (currentStep === 1) {
          const lStyle = 'display:flex;align-items:flex-start;gap:10px;margin-bottom:12px;text-align:left;font-size:13px;cursor:pointer;line-height:1.5;';
          const cbStyle = 'margin-top:2px;accent-color:var(--primary-color);flex-shrink:0;';
          const normals = [
            '楽曲の検索機能が使いにくく、目的の曲やアーティストが見つけにくい',
            'ポッドキャストやラジオ番組のラインナップに興味が持てない、または少ない',
            'アプリの強制終了や音切れなど、サービスの利用に関して技術的な問題があった',
            '無料トライアル期間が短すぎたため、サービスの価値を十分に判断できなかった',
            '音質が低く、期待していたクオリティの音楽体験が得られなかった',
            'アプリケーションの動作全体が重く、画面の遷移や読み込みにストレスを感じる',
            '学生割引やファミリープランなど、特定のプランの認証・登録手続きに問題があった',
            'レコメンド（おすすめ）機能の精度が低く、自分の好みに合う音楽やポッドキャストが見つからなかった',
            'アプリからの通知（新曲案内やおすすめ、広告等）が多すぎて煩わしい',
            'オフライン再生（楽曲ダウンロード機能）の保存可能件数や制限に不満がある',
            'クレジットカードの承認エラーなど、お支払いおよび請求に問題があった',
            '楽曲の総数や配信ラインナップ自体が不十分である',
            '生活スタイルの変化などにより、サービスの定期購入をあまり利用しなかった',
            '定期購入（サブスクリプション）の料金を支払う余裕がない（月額料金が高い）',
            '現在のプランから、別のプラン（ファミリープランや年額プラン等）に切り替える',
          ];
          const normalHtml = normals.map(r =>
            `<label style="${lStyle}"><input type="checkbox" class="b-main-cb" value="${r}" onchange="checkBStep1()" style="${cbStyle}"><span>${r}</span></label>`
          ).join('');
          const altServiceNames = ['Apple Music','Amazon Music','YouTube Music','LINE MUSIC','AWA'];
          const altSubsHtml = altServiceNames.map(s =>
            `<label style="${lStyle}"><input type="checkbox" class="b-alt-sub-cb" value="${s}" onchange="checkBStep1()" style="${cbStyle}"><span>${s}</span></label>`
          ).join('');
          area.innerHTML = `
            <div class="step-indicator">ステップ 1 / 3</div>
            <h1>解約理由をお聞かせください</h1>
            <p style="margin-bottom:16px;">当てはまるものをすべてお選びください（1つ以上必須）</p>
            <div style="text-align:left;margin-bottom:20px;">
              ${normalHtml}
              <label style="${lStyle}">
                <input type="checkbox" id="b-alt-service" class="b-main-cb"
                       value="もっと好みに合う他の音楽配信サービスを見つけた"
                       onchange="toggleBAltService(this)" style="${cbStyle}">
                <span>もっと好みに合う他の音楽配信サービスを見つけた</span>
              </label>
              <div id="alt-subs" style="display:none;padding-left:26px;margin-top:4px;margin-bottom:8px;border-left:2px solid #333;">
                ${altSubsHtml}
                <label style="${lStyle}">
                  <input type="checkbox" id="b-alt-other-cb" class="b-alt-sub-cb" value="その他"
                         onchange="toggleBAltOther(this)" style="${cbStyle}">
                  <span>その他（以下に具体的にご記入ください）</span>
                </label>
                <div id="b-alt-other-wrap" style="display:none;margin-top:6px;margin-bottom:8px;">
                  <input id="b-alt-other-input" type="text" oninput="checkBStep1()" placeholder="サービス名を入力"
                         style="width:100%;background:#282828;border:none;color:white;padding:8px 12px;border-radius:4px;font-size:13px;box-sizing:border-box;">
                </div>
              </div>
              <label style="${lStyle}">
                <input type="checkbox" id="b-other-reason" class="b-main-cb"
                       value="その他（上記のいずれの理由にも当てはまらない）"
                       onchange="toggleBOtherReason(this)" style="${cbStyle}">
                <span>その他（上記のいずれの理由にも当てはまらない）</span>
              </label>
              <div id="b-other-wrap" style="display:none;margin-top:6px;margin-bottom:8px;">
                <textarea id="b-other-ta" rows="3" oninput="checkBStep1()" placeholder="10文字以上入力してください"
                          style="width:100%;background:#282828;border:none;color:white;padding:12px;border-radius:4px;resize:none;font-size:13px;box-sizing:border-box;margin-bottom:4px;"></textarea>
                <div id="b-other-hint" style="font-size:11px;color:#727272;">0 / 10文字以上</div>
              </div>
            </div>
            <div class="btn-row">
              <button id="next-btn-b" class="btn btn-cancel-b" disabled onclick="advanceBStep1()"
                      style="opacity:0.4;cursor:not-allowed;">次へ進む</button>
              <button class="btn btn-outline" onclick="finishExp('keep')">解約手続きを中止する</button>
            </div>
          `;
        } else if (currentStep === 2) {
          area.innerHTML = `
            <div class="step-indicator">ステップ 2 / 3</div>
            <h1>解約に関する重要事項</h1>
            <p style="margin-bottom:12px;font-size:13px;">以下の内容を最後までお読みください。</p>
            <div id="terms-box" onscroll="checkBScroll()"
                 style="height:280px;overflow-y:scroll;background:#1e1e1e;border-radius:6px;
                        padding:16px;text-align:left;font-size:12px;line-height:1.9;color:#ccc;
                        margin-bottom:16px;-webkit-overflow-scrolling:touch;">
              <strong style="color:#fff;font-size:14px;display:block;margin-bottom:12px;">SoundFlow プレミアムプラン解約における重要事項説明</strong>
              本手続きを完了すると、SoundFlowプレミアムプラン（以下、本サービス）の解約処理が行われ、次回更新日以降は無料プラン（Freeプラン）へと自動的に移行します。手続きの前に、以下の注意事項を必ず最後までお読みください。<br><br>
              <strong style="color:#fff;">1. 解約後の楽曲再生について</strong><br>
              解約手続き完了後も、現在の請求サイクルの終了日（${deadlineStr}）までは引き続きプレミアムプランの機能をご利用いただけます。期間終了後は自動的に広告付きのFreeプランに切り替わり、一部の機能が制限されます。<br><br>
              <strong style="color:#fff;">2. オフライン再生およびダウンロード楽曲の削除</strong><br>
              Freeプランへの移行に伴い、これまで端末にダウンロードした楽曲のオフライン再生は一切ご利用いただけなくなります。保存された音声データは端末のストレージから順次自動消去されますので、通信量にご注意ください。<br><br>
              <strong style="color:#fff;">3. 音質制限について</strong><br>
              プレミアムプランで提供されていた最高音質（320kbps）での再生はご利用いただけなくなります。Freeプランでは標準音質（160kbps）または低音質（96kbps）に固定され、ネットワーク環境に応じて自動調整されます。<br><br>
              <strong style="color:#fff;">4. ファミリープラン・学生割引の再登録制限</strong><br>
              現在、学生割引プランまたはファミリープランをご利用の場合、一度解約すると再登録時に再度認証手続き（在籍証明書の提出や家族の招待リンクの再発行など）が必要となります。また、キャンペーン等による特別料金での再登録はできません。<br><br>
              <strong style="color:#fff;">5. 返金および日割り計算の不適用</strong><br>
              契約期間の途中で解約された場合であっても、月額料金の日割り計算による返金、および月途中の解約に伴う清算は一切行われません。あらかじめご了承ください。<br><br>
              <strong style="color:#fff;">6. サードパーティ製デバイスとの連携解除</strong><br>

      if ([...document.querySelectorAll('.b-main-cb:checked')].length === 0) { setBNextBtnB(false); return; }

      if (altCb && altCb.checked) {

        if (altSubs.length === 0) { setBNextBtnB(false); return; }
        const altOtherCb = document.getElementById('b-alt-other-cb');
        if (altOtherCb && altOtherCb.checked) {

          if (!inp || inp.value.trim().length < 1) { setBNextBtnB(false); return; }

      if (otherCb && otherCb.checked) {
        const ta = document.getElementById('b-other-ta');
        const hint = document.getElementById('b-other-hint');
        const len = ta ? ta.value.length : 0;
        if (hint) hint.textContent = `${len} / 10文字以上`;
        if (len < 10) { setBNextBtnB(false); return; }
      }
      setBNextBtnB(true);

    function setBNextBtnB(ok) {
      const btn = document.getElementById('next-btn-b');

      btn.disabled = !ok;

      btn.style.cursor = ok ? 'pointer' : 'not-allowed';

    function finishExp(decision, extra = {}) {
      endTime = Date.now();
      active = false;
      const timeElapsed = endTime - startTime;

      document.getElementById('screen-main').classList.add('hidden');

      // スプレッドシートへ送信
      const payload = {
        participantId: participantId,
        condition:    cond,
        decision:     decision,
        dropStep:     currentStep,
        time:         timeElapsed,
        mouse:        Math.round(mouseDistance),
        clicks:       clickCount,
        checkedCount: extra.checkedCount ?? null,
        checkedItems: extra.checkedItems ? extra.checkedItems.join(' / ') : null,
        altServices:  extra.altServices ? extra.altServices.join(' / ') : null,
        freeText:     extra.freeText ?? null
      };
      fetch(GAS_URL, {
        method:  'POST',
        mode:    'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload)
      }).catch(err => console.warn('送信エラー:', err));

      renderEndScreen(decision);
    }

    function submitSurvey(decCode) {
      const get = name => {

        return el ? el.value : null;

      const q1 = get('q1'), q2 = get('q2'), q3 = get('q3'), q4 = get('q4');
      const q5 = (document.getElementById('survey-q5') || {}).value || '';
      const age = (document.getElementById('survey-age') || {}).value || '';
      const gender = get('gender');
      const msg = document.getElementById('survey-msg');

      if (!q1 || !q2 || !q3 || !q4 || !age || !gender) {
        msg.style.color = '#e91429';
        msg.textContent = '※ ①〜⑦はすべてご記入・ご選択ください';
        return;
      }
      msg.style.color = '#b3b3b3';
      msg.textContent = '送信中...';

      fetch(GAS_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type: 'survey', participantId: participantId, condition: cond, decision: decCode, age, gender, q1, q2, q3, q4, q5 })
      }).then(() => {
        msg.style.color = '#1DB954';
        msg.textContent = '✓ 送信しました。下にスクロールすると正常に解約できたか確認できます。';
        document.querySelector('#survey-form button[onclick]') && (document.querySelector('#survey-form button[onclick]').disabled = true);
        const reveal = document.getElementById('mypage-reveal');
        if (reveal) reveal.style.display = 'block';

        msg.style.color = '#e91429';
        msg.textContent = '送信に失敗しました。もう一度お試しください。';
      });

    function checkMobile() {
      // 「PC版サイトをリクエスト」で window.innerWidth と navigator.userAgent は偽装されるため、
      // 偽装されにくい実画面サイズ（screen.width）とタッチ対応（maxTouchPoints）も併せて判定する。
      // ただしWindows機はUA偽装の心配がなく、また画面拡大率設定でscreen.widthが実寸より小さく
      // 報告されるノートPCも多いため、window.innerWidthのみで判定する。
      const isWindows = /Windows NT/i.test(navigator.userAgent);
      const isMobile = isWindows
        ? window.innerWidth < 768
        : window.innerWidth < 768
          || /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)
          || Math.min(screen.width, screen.height) < 768
          || navigator.maxTouchPoints > 0;
      const modal = document.getElementById('mobile-block');
      if (isMobile) {
        document.getElementById('mobile-url-display').textContent = window.location.href;
        modal.style.display = 'flex';
      } else {
        modal.style.display = 'none';
      }
    }

    function copyUrl() {
      const url = window.location.href;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✓ コピーしました！';
        setTimeout(() => { btn.textContent = '📋 URLをコピーする'; }, 2000);
      }).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = url;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        const btn = document.getElementById('copy-btn');
        btn.textContent = '✓ コピーしました！';
        setTimeout(() => { btn.textContent = '📋 URLをコピーする'; }, 2000);
      });
    }

    function shareUrl() {
      const url = window.location.href;
      if (navigator.share) {
        navigator.share({ url: url }).catch(() => {});
      } else {
        copyUrl();
      }
    }

    checkMobile();
    window.addEventListener('resize', checkMobile);

  </script>
</body>
</html>
